apply plugin: 'com.android.application'

android {
    ndkVersion "27.0.12077973"

    compileSdk = 36

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 34

        versionName "20.2.6"
        versionCode = 57

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    // Which glasses-free 3D panel the build targets. The two need different machinery: a
    // bonded lenticular lens weaves the eyes into fixed screen columns, which a shader can
    // do unaided, while Leia's diffractive backlight steers its views from where the
    // viewer's face is and only Leia's own SDK knows how to drive it.
    flavorDimensions.add("panel")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "data:text/html;base64,PGgxPlJvb3QgYnVpbGQgaXMgbm90IGF2YWlsYWJsZTwvaDE+"

            applicationId "com.limelight.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22com.limelight.noir%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2FClassicOldSong%2Fmoonlight-android%22%2C%22author%22%3A%22ClassicOldSong%22%2C%22name%22%3A%22Artemis%22%2C%22additionalSettings%22%3A%22%7B%5C%22apkFilterRegEx%5C%22%3A%5C%22nonRoot%5C%22%2C%5C%22matchGroutToUse%5C%22%3A%5C%22%241%5C%22%2C%5C%22versionExtractionRegEx%5C%22%3A%5C%22v(.%2B)%5C%22%7D%22%7D"

            applicationId "com.limelight"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }

        // Leia lightfield panels — the Lume Pad 2. Needs Leia's proprietary CNSDK in
        // app/libs and app/src/leiaLumepad/jniLibs, which is licensed only to Leia's
        // partners and is deliberately not committed. Build this flavour for your own
        // device only; an APK from it cannot be redistributed.
        //
        // Named leiaLumepad (not plain "leia") so it reads as one of two device-specific
        // leia-panel flavours side by side with leiaRedmagic below, rather than looking
        // like "the" Leia flavour with Red Magic as an afterthought. applicationIdSuffix
        // stays plain ".leia" though -- that's the installed package identity on real
        // devices, and changing it would orphan any existing install's app data.
        leiaLumepad {
            dimension "panel"
            buildConfigField "boolean", "LEIA_BUILD", "true"

            // Lume Pad 2 in 3D runs on the diffractive light alone with the uniform
            // backlight off, so the same system brightness looks darker than in 2D, and
            // adaptive brightness makes it worse without showing it (measured: held at 203
            // against a system setting of 252). RedMagic's own adaptive brightness already
            // does the right thing without this (on-device A/B, see PanelDriver's flavour
            // comment), so it's a per-device field rather than shared behaviour.
            buildConfigField "boolean", "FORCE_MAX_BRIGHTNESS", "true"

            // Without this the panel flavours share an application id, so installing one
            // silently replaces another and there is no way to tell from the device which
            // is actually there. They target different hardware and are worth keeping side
            // by side on a desk that has several.
            applicationIdSuffix ".leia"
        }

        // Leia lightfield panels — the Red Magic Tablet 3D Explorer Edition (model NP02J,
        // codename K68). Same Java/manifest/res as `leiaLumepad` (see the sourceSets block
        // below — the CNSDK Java API is identical between devices per
        // docs/red-magic-3d-explorer.md), but this device ships a newer CNSDK line on its
        // system services (0.10.40/0.10.18/0.5.50 vs the Lume Pad 2's 0.8.20), so it needs
        // its own matching connector: app/libs/redmagic and app/src/leiaRedmagic/jniLibs.
        // Extracted from this device's own bundled ZTE/Leia system apps — see that same
        // doc for how and why. Same no-redistribution rule as `leiaLumepad` applies.
        leiaRedmagic {
            dimension "panel"
            buildConfigField "boolean", "LEIA_BUILD", "true"
            buildConfigField "boolean", "FORCE_MAX_BRIGHTNESS", "false"
            applicationIdSuffix ".leia.redmagic"
        }
    }

    sourceSets {
        // leiaRedmagic reuses leiaLumepad's Java/manifest/res as-is (identical CNSDK Java
        // API, identical PanelDriver/LeiaMediaSDK glue) — only the compiled connector
        // (app/libs/<device>, app/src/<flavor>/jniLibs, .../assets/cnsdk.version) differs.
        leiaRedmagic {
            java.srcDirs += ['src/leiaLumepad/java']
            manifest.srcFile 'src/leiaLumepad/AndroidManifest.xml'
            res.srcDirs += ['src/leiaLumepad/res']
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".noirdebug"
            resValue "string", "app_label", "Lumelight 3D"
            resValue "string", "app_label_root", "Lumelight 3D (Root)"
            resValue "string", "app_label_game", "Lumelight 3D (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            applicationIdSuffix ".noir"
            resValue "string", "app_label", "Lumelight 3D"
            resValue "string", "app_label_root", "Lumelight 3D (Root)"
            resValue "string", "app_label_game", "Lumelight 3D (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.6.2'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.ByteHamster:SearchPreference:v2.5.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'
    implementation 'org.opencv:opencv:4.12.0'

    // Leia's CNSDK, which drives the lightfield backlight and weaves the views to follow
    // the viewer's face. It is not published to any repository, so the jar has to be put in
    // app/libs by hand and only the leia-panel flavours look for it. See app/libs/README.md.
    // Each device gets its own copy because the two ship different CNSDK lines on-device
    // (see the leiaRedmagic flavour comment above) and the connectors are not interchangeable.
    leiaLumepadImplementation fileTree(dir: 'libs', include: ['leia-cnsdk*.jar'])
    leiaRedmagicImplementation fileTree(dir: 'libs/redmagic', include: ['leia-cnsdk*.jar'])

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.19.0'
}
